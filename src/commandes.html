<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAZ-CAM</title>
    <link rel="stylesheet" href="./css/output.css">
</head>

<body class="bg-[#0A0908] dark:bg-taupe-50 text-white dark:text-black transition-colors duration-300">

    <header
        class="fixed top-0 w-full z-50 bg-[#0F0E0A] dark:bg-[#ffff] border-b border-[#8b4513] dark:border-orange-500">
        <div class="flex items-center justify-between px-4 py-3 md:hidden">
            <div class="flex items-center">
                <button id="hamburgerBtn" class="relative z-[9999]">
                    <img src="./assets/logo/menu-line (1).svg" alt="menu" class="icon-open w-8 h-8 dark:hidden  ">
                    <img src="./assets/logo/menu-line.svg" alt="ligth-menu"
                        class="menu-ligth w-8 h-8 hidden dark:block ">

                    <img src="./assets/logo/close-large-line.svg" alt="close"
                        class="icon-close w-8 h-8 hidden dark:hidden">
                    <img src="./assets/logo/close-large-line-black.svg" alt="close" class="close-ligth w-8 h-8 hidden">


                </button>



            </div>
        </div>
        <nav id="mainNav"
            class=" fixed md:static top-0 left-[-300px] md:left-0 w-72 md:w-full h-full md:h-auto  transition-all duration-300  md:items-center md:justify-between md:px-6 md:py-4 z-40 bg-linear-135 bg-[#0F0E0A] dark:bg-[#ffff] ">
            <div class="flex flex-col md:flex-row md:items-center justify-between h-full md:h-auto p-3  ">
                <h2 class="md:block text-2xl font-bold pl-12 md:pl-0">
                    <span class="text-orange-600">PRO</span>
                    <span class="text-blue-600">DUIT</span>
                </h2>
                <div class="flex flex-col md:flex-row gap-4 md:gap-6 ">
                    <a href="./main.html"
                        class="text-sm duration-300 ease-in-out hover:text-orange-600 hover:-translate-y-1 transition-all">Acceuil</a>

                    <a href="./Produit.html"
                        class="text-sm hover:text-orange-600 hover:-translate-y-1 transition-all">Produit</a>
                    <a href="#kpls" class="text-sm hover:text-orange-600 hover:-translate-y-1 transition-all">A
                        propos</a>
                </div>
                <div class="flex flex-col md:flex-row gap-4 mt-6 md:mt-0">

                    <label class="inline-flex items-center cursor-pointer gap-3">

                        <!-- Icône Lune (visible en mode sombre) -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22"
                            class="block dark:hidden  transition-all duration-300 scale-90 opacity-80"
                            viewBox="0 0 256 256">
                            <path fill="currentColor"
                                d="M233.54,142.23a8,8,0,0,0-8-2,88.08,88.08,0,0,1-109.8-109.8,8,8,0,0,0-10-10,104.84,104.84,0,0,0-52.91,37A104,104,0,0,0,136,224a103.09,103.09,0,0,0,62.52-20.88,104.84,104.84,0,0,0,37-52.91A8,8,0,0,0,233.54,142.23Z">
                            </path>
                        </svg>

                        <!-- Icône Soleil (visible en mode clair) -->

                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22"
                            class="hidden dark:block transition-all duration-300 scale-90 opacity-80"
                            viewBox="0 0 24 24">

                            <path fill="currentColor"
                                d="M12 18C8.68629 18 6 15.3137 6 12C6 8.68629 8.68629 6 12 6C15.3137 6 18 8.68629 18 12C18 15.3137 15.3137 18 12 18ZM11 1H13V4H11V1ZM11 20H13V23H11V20ZM3.51472 4.92893L4.92893 3.51472L7.05025 5.63604L5.63604 7.05025L3.51472 4.92893ZM16.9497 18.364L18.364 16.9497L20.4853 19.0711L19.0711 20.4853L16.9497 18.364ZM19.0711 3.51472L20.4853 4.92893L18.364 7.05025L16.9497 5.63604L19.0711 3.51472ZM5.63604 16.9497L7.05025 18.364L4.92893 20.4853L3.51472 19.0711L5.63604 16.9497ZM23 11V13H20V11H23ZM4 11V13H1V11H4Z">

                            </path>
                        </svg>

                        <!-- Switch -->
                        <input id="toogleDark" type="checkbox" class="sr-only peer">

                        <div class="relative w-10 h-6 bg-gray-300 dark:bg-gray-600 rounded-full
                            peer-checked:bg-orange-500 dark:peer-checked:bg-orange-400
                            after:content-[''] after:absolute after:top-[3px] after:left-[3px]
                            after:w-4 after:h-4 after:bg-white after:rounded-full
                            after:transition-all after:duration-300
                            peer-checked:after:translate-x-[1.1rem]
                            peer-checked:after:rotate-180">
                        </div>

                    </label>



                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22"
                        class="text-gray-800 dark:text-gray-200">
                        <path fill="currentColor"
                            d="M120,40V16a8,8,0,0,1,16,0V40a8,8,0,0,1-16,0Zm72,88a64,64,0,1,1-64-64A64.07,64.07,0,0,1,192,128Z">
                        </path>
                    </svg>

                    </label>

                    <!--bouton de login-->
                    <div id="guest-menu">

                        <button class="bg-orange-600 hover:bg-orange-700  rounded px-9 py-2 text-white"
                            data-modal-target="connexion-modal" data-modal-toggle="connexion-modal">
                            se conneter
                        </button>

                        <button class="bg-orange-600 hover:bg-orange-700  rounded px-9 py-2 text-white"
                            data-modal-target="sign-in-mogal" data-modal-toggle="sign-in-mogal">
                            s'inscrire
                        </button>
                    </div>

                    <!--buton de l'avatar-->
                    <div id="user-menu" class="hidden relative">
                        <div id="avatarButton" type="button" data-dropdown-toggle="userDropdown"
                            data-dropdown-placement="bottom-start"
                            class="bg-orange-600 cursor-pointer relative inline-flex items-center justify-center w-10 h-10 overflow-hidden bg-neutral-tertiary rounded-full">
                            <span id="userInitials" class="text-white  font-bold text-body"></span>
                        </div>

                        <!-- Dropdown menu -->
                        <div id="userDropdown"
                            class="bg-amber-50 z-10 hidden bg-neutral-primary-medium border border-default-medium rounded-base shadow-lg w-44">
                            <div class="text-black px-4 py-3 border-b border-default-medium text-sm text-heading">
                                <div id="afficheNom" class="font-medium"></div>
                                <div id="afficheEmail" class="truncate"></div>
                            </div>
                            <ul class="text-black hover:bg-amber-200 p-2 text-sm text-body font-medium"
                                aria-labelledby="avatarButton">

                                <li>
                                    <a id="logoutBtn"
                                        class="block w-full p-2 hover:bg-neutral-tertiary-medium text-fg-danger rounded-md">deconnexion
                                    </a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main>

        <section>


            <!-- ========================= -->
            <!--        MODAL CONNEXION    -->
            <!-- ========================= -->
            <div id="connexion-modal" tabindex="-1" aria-hidden="true"
                class="hidden backdrop-blur-md overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">

                <div class="relative p-4 w-full max-w-md max-h-full">
                    <div
                        class="relative bg-neutral-primary-soft border border-default rounded-base shadow-sm p-4 md:p-6 bg-[#0A0908] dark:bg-white">

                        <!-- Header -->
                        <div class="flex items-center justify-between border-b border-default pb-4 md:pb-5">
                            <h3 class="text-lg font-medium text-heading">Connexion</h3>

                            <button type="button"
                                class="text-body bg-transparent hover:bg-neutral-tertiary hover:text-heading rounded-base text-sm w-9 h-9 ms-auto inline-flex justify-center items-center"
                                data-modal-hide="connexion-modal">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M6 18 17.94 6M18 18 6.06 6" />
                                </svg>
                            </button>
                        </div>

                        <!-- Formulaire de connexion -->
                        <form id="loginForm" method="post" class="pt-4 md:pt-6">

                            <!-- Email -->
                            <div class="mb-4">
                                <label for="loginEmail"
                                    class="block mb-2.5 text-sm font-medium text-heading">Email</label>
                                <input type="email" id="loginEmail" name="email"
                                    class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base 
                                   focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body" placeholder="example@company.com"
                                    required />
                            </div>

                            <!-- Mot de passe -->
                            <div class="mb-4">
                                <label for="loginPassword" class="block mb-2.5 text-sm font-medium text-heading">Mot de
                                    passe</label>

                                <div class="relative">
                                    <input type="password" id="loginPassword" name="password"
                                        class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base 
                                       focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body" placeholder="•••••••••" required />

                                    <!-- Bouton SVG afficher/cacher -->
                                    <button type="button" id="toggleLoginPassword"
                                        class="absolute right-3 top-3 text-heading dark:text-white">

                                        <!-- Icône eye -->
                                        <svg id="icon-eye-login" class="w-5 h-5" fill="none" stroke="currentColor"
                                            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                            <path
                                                d="M2.458 12C3.732 7.943 7.522 5 12 5s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S3.732 16.057 2.458 12z" />
                                            <circle cx="12" cy="12" r="3" />
                                        </svg>

                                        <!-- Icône eye-slash -->
                                        <svg id="icon-eye-slash-login" class="w-5 h-5 hidden" fill="none"
                                            stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                                            stroke-linejoin="round">
                                            <path
                                                d="M3 3l18 18M10.584 10.587A3 3 0 0113.413 13.41M6.423 6.423C4.392 7.75 2.88 9.72 2.458 12c1.274 4.057 5.064 7 9.542 7 
                                             1.63 0 3.17-.33 4.57-.93M17.577 17.577C19.608 16.25 21.12 14.28 21.542 12c-.61-1.94-1.72-3.69-3.17-5.02" />
                                        </svg>

                                    </button>
                                </div>



                                <!-- Message d’erreur -->
                                <p id="loginError" class="text-red-500 text-sm mt-1 hidden">
                                    Mot de passe incorrect !
                                </p>
                            </div>

                            <!-- Remember me -->
                            <div class="flex items-start my-6">
                                <div class="flex items-center">
                                    <input id="checkbox-login-remember" type="checkbox"
                                        class="w-4 h-4 border border-default-medium rounded-xs bg-neutral-secondary-medium focus:ring-2 focus:ring-brand-soft">
                                    <label for="checkbox-login-remember"
                                        class="ms-2 text-sm font-medium text-heading">Se souvenir</label>
                                </div>
                                <a href="#" class="ms-auto text-sm font-medium text-fg-brand hover:underline">Mot de
                                    pass oublie?</a>
                            </div>

                            <!-- Bouton login -->
                            <button type="submit"
                                class="text-white bg-orange-600 hover:bg-orange-700 border border-transparent focus:ring-4 focus:ring-brand-medium shadow-xs font-medium rounded-base text-sm px-4 py-2.5 w-full mb-3">
                                Se connecter
                            </button>

                            <!-- Lien vers inscription -->
                            <div class="text-sm font-medium text-body">
                                Not registered?
                                <button data-modal-hide="connexion-modal" data-modal-target="sign-in-mogal"
                                    data-modal-toggle="sign-in-mogal"
                                    class="hover:text-orange-600 underline text-blue-600">
                                    S'inscrire
                                </button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>


             <!-- ========================= -->
            <!--     MODAL INSCRIPTION     -->
            <!-- ========================= -->
            <div id="sign-in-mogal" tabindex="-1" aria-hidden="true"
                class="hidden backdrop-blur-md overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">

                <div class="relative p-4 w-full max-w-md max-h-full">
                    <div
                        class="relative bg-neutral-primary-soft border border-default rounded-base shadow-sm p-4 md:p-6 bg-[#0A0908] dark:bg-white">

                        <!-- Header -->
                        <div class="flex items-center justify-between border-b border-default pb-4 md:pb-5">
                            <h3 class="text-lg font-medium text-heading">Créer un compte</h3>

                            <button type="button"
                                class="text-body bg-transparent hover:bg-neutral-tertiary hover:text-heading rounded-base text-sm w-9 h-9 ms-auto inline-flex justify-center items-center"
                                data-modal-hide="sign-in-mogal">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M6 18 17.94 6M18 18 6.06 6" />
                                </svg>
                            </button>
                        </div>

                        <!-- Formulaire inscription -->
                        <form id="registerForm" method="post" class="pt-4 md:pt-6">

                            <!-- Nom -->
                            <div class="mb-4">
                                <label for="registerNom"
                                    class="block mb-2.5 text-sm font-medium text-heading">Nom</label>
                                <input type="text" id="registerNom" name="nom"
                                    class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base 
                                   focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body"
                                    placeholder="taper votre nom ici..." required />
                            </div>

                            <!-- Prénom -->
                            <div class="mb-4">
                                <label for="registerPrenom"
                                    class="block mb-2.5 text-sm font-medium text-heading">Prénom</label>
                                <input type="text" id="registerPrenom" name="prenom"
                                    class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base 
                                   focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body" placeholder="taper votre prénom ici..."
                                    required />
                            </div>

                            <!-- Email -->
                            <div class="mb-4">
                                <label for="registerEmail"
                                    class="block mb-2.5 text-sm font-medium text-heading">Email</label>
                                <input type="email" id="registerEmail" name="email"
                                    class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base 
                                   focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body" placeholder="example@company.com"
                                    required />
                            </div>

                            <!-- Mot de passe -->
                            <div class="mb-4">
                                <label for="registerPassword" class="block mb-2.5 text-sm font-medium text-heading">
                                    Mot de passe
                                </label>

                                <div class="relative">
                                    <input type="password" id="registerPassword" name="password"
                                        class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base 
                                       focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body" placeholder="•••••••••" required />

                                    <!-- Bouton SVG afficher/cacher -->
                                    <button type="button" id="toggleRegisterPassword"
                                        class="absolute right-3 top-3 text-heading dark:text-white">

                                        <!-- Icône eye -->
                                        <svg id="icon-eye-register" class="w-5 h-5" fill="none" stroke="currentColor"
                                            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                            <path
                                                d="M2.458 12C3.732 7.943 7.522 5 12 5s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S3.732 16.057 2.458 12z" />
                                            <circle cx="12" cy="12" r="3" />
                                        </svg>

                                        <!-- Icône eye-slash -->
                                        <svg id="icon-eye-slash-register" class="w-5 h-5 hidden" fill="none"
                                            stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                                            stroke-linejoin="round">
                                            <path
                                                d="M3 3l18 18M10.584 10.587A3 3 0 0113.413 13.41M6.423 6.423C4.392 7.75 2.88 9.72 2.458 12c1.274 4.057 5.064 7 9.542 7 
                                             1.63 0 3.17-.33 4.57-.93M17.577 17.577C19.608 16.25 21.12 14.28 21.542 12c-.61-1.94-1.72-3.69-3.17-5.02" />
                                        </svg>

                                    </button>
                                </div>

                                <!-- Indicateur de force -->
                                <p id="passwordStrength" class="text-sm mt-1 font-medium"></p>

                                <!-- Message d’erreur -->
                                <p id="registerError" class="text-red-500 text-sm mt-1 hidden">
                                    Mot de passe incorrect
                                </p>
                            </div>



                            <!-- Bouton inscription -->
                            <button type="submit"
                                class="text-white bg-orange-600 hover:bg-orange-700 border border-transparent focus:ring-4 focus:ring-brand-medium shadow-xs font-medium rounded-base text-sm px-4 py-2.5 w-full mb-3">
                                S'inscrire
                            </button>

                            <!-- Lien vers connexion -->
                            <div class="text-sm font-medium text-body">
                                Already registered?
                                <button data-modal-hide="sign-in-mogal" data-modal-target="connexion-modal"
                                    data-modal-toggle="connexion-modal"
                                    class="hover:text-orange-600 underline text-blue-600">
                                    Se connecter
                                </button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
           

        </section>

        <section class="bg-[#0A0908] p-6 dark:bg-taupe-50 md:p-28">
            <h3 class="text-[#F4650A] text-lg right-0"> Mes Commandes</h3>
            <h2 class="text-4xl font-bold mt-4">VOIR CES COMMANDE PASSER</h2>
            <div id="commandesContainer" class="p-3"></div>
        </section>

    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/zxcvbn/4.4.2/zxcvbn.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
    <script src="./main.js" defer></script>
</body>


</html>
